[build]
builder = "NIXPACKS"
# Schema sync at BUILD often fails — DATABASE_URL may be unavailable. Sync runs at container start instead.
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Recommended Railway variables: SKIP_DB_PUSH=true, EMBED_WORKER=false (if Redis unstable)
